name: Build and Release for 1.21.1

on:
  push:
    branches: [ 1.21-release ]

jobs:
  build:
    name: Builds and Release on Github and Saps
    uses: nanite/workflows/.github/workflows/standard-release.yml@v1
    with:
      java-version: 21
      curse-publish-task: ""
    secrets:
      saps-token: ${{ secrets.SAPS_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build release JAR
        run: bash gradlew build

      - name: Publish Minecraft Mods
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: MNBGnhBw
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 845405
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files-primary: "./build/libs/*.jar"
          changelog-file: "./CHANGELOG.md"

          loaders: neoforge
          game-versions: |
            1.21.1
          java: 21
